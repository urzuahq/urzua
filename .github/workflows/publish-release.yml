name: publish release
# Implements: ADR-0013, ADR-0045, ADR-0047

# Runs when the release PR (opened by prepare-release.yml) merges into main
# -- the deliberate act in this two-step flow (ADR-0045). Owns the entire
# publish: tag, GitHub Release, cross-compiled binaries, and their upload.
#
# One workflow rather than two deliberately (BUG-0028). The tag here is
# pushed with GITHUB_TOKEN, and GitHub never triggers a workflow from a
# GITHUB_TOKEN event -- so a separate tag-triggered build workflow silently
# never runs, and the release publishes with no binaries and no error.
on:
  pull_request:
    types: [closed]
    branches: [main]

concurrency:
  group: publish-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Runs the checks here rather than asking whether `ci` ran elsewhere
  # (ADR-0047). The release PR is opened by a GitHub App, so its own `ci` run
  # executes and gates the merge (ADR-0095), but a cross-workflow query could
  # only report that a run happened, and on the PR head, not on the commit
  # being tagged. This workflow is triggered by the merge, so it always runs,
  # against the tree it is about to release.
  #
  # Pinned to merge_commit_sha: for a squash merge that is the commit created
  # on main, which is the commit knope tags below. The PR head is a different
  # commit and the default checkout ref is a third -- verifying the released
  # tree means naming it, not inferring it.
  verify:
    if: github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'release' && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/checks.yml
    # A caller must grant what the called workflow's job asks for, and its
    # gate can comment on a pull request. This event is the merged release PR,
    # whose comment would be rewritten for a tree nobody is reviewing, so the
    # comment is switched off: the grant stays, nothing is posted.
    permissions:
      contents: read
      pull-requests: write
    with:
      ref: ${{ github.event.pull_request.merge_commit_sha }}
      comment: "false"

  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Pushes the release tag and creates the GitHub Release -- narrow and
      # explicit, not the workflow-level default.
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0
          # The commit `verify` tested, not the default ref.
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      # The pin and its checksum live in one place (.github/actions/install-knope).
      - uses: ./.github/actions/install-knope

      - name: configure git identity for the release tag
        run: |
          git config user.name "urzua-release-bot"
          git config user.email "urzua-release-bot@users.noreply.github.com"

      - name: tag and create the GitHub Release (ADR-0045)
        run: knope release --verbose
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # The tag knope just created, read from the same file and with the
      # same anchored pattern knope.toml itself bumps -- never re-derived
      # from a second source that could disagree with it.
      - name: resolve the tag knope created
        id: version
        run: |
          set -euo pipefail
          version=$(grep -m1 -E '^version = "' rust/Cargo.toml | sed 's/^version = "\(.*\)"$/\1/')
          if [ -z "$version" ]; then
            echo "::error::could not read the released version from rust/Cargo.toml"
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "resolved tag: v$version"

  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          # No Intel Mac build: Intel Macs build from source with cargo install.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        working-directory: rust
    steps:
      # Builds the tag knope created, not the branch head -- they are the
      # same commit today, but pinning the ref means a push landing on main
      # mid-publish can never produce binaries that disagree with the
      # release they are attached to.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release.outputs.tag }}
      - name: install target
        run: rustup target add ${{ matrix.target }}
      # The deployment target, not the runner image, decides which macOS
      # versions the binary supports. Runner images get retired (macos-14
      # was), so build on macos-latest and pin the minimum macOS here.
      - name: build
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ contains(matrix.target, 'apple-darwin') && '11.0' || '' }}
        run: cargo build --release --locked --target ${{ matrix.target }} -p urzua-cli
      - name: package
        run: |
          name="urzua-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/urzua" "dist/$name/"
          cp ../LICENSE ../README.md "dist/$name/"
          tar -czf "dist/$name.tar.gz" -C dist "$name"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: rust/dist/urzua-${{ matrix.target }}.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: urzua-${{ matrix.target }}
          path: rust/dist/urzua-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  upload:
    needs: [release, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      # `knope release` above already created this release with real
      # changelog-sourced notes (ADR-0045) -- upload attaches the archives to
      # it rather than creating a second, conflicting release object.
      - name: upload the built archives to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" dist/*.tar.gz --clobber --repo "${{ github.repository }}"
      # A release with no attached archive is the defect BUG-0028 records:
      # it looks published and cannot be installed. Assert rather than trust.
      - name: verify the release actually carries its archives
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          count=$(gh release view "$TAG" --repo "${{ github.repository }}" --json assets --jq '.assets | length')
          echo "$TAG carries $count asset(s)"
          if [ "$count" -lt 2 ]; then
            echo "::error::expected 2 archives on $TAG, found $count"
            exit 1
          fi
