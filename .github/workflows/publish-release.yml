name: publish release

# Runs when the release PR (opened by prepare-release.yml) merges into main
# -- the deliberate act in this two-step flow (ADR-0045). Tags the
# now-current version and creates the GitHub Release; the tag push fires
# the existing tag-triggered release.yml (cross-compiled binaries) unchanged.
on:
  pull_request:
    types: [closed]
    branches: [main]

concurrency:
  group: publish-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish-release:
    if: github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Pushes the release tag and creates the GitHub Release -- narrow and
      # explicit, not the workflow-level default.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: install knope 0.23.0 (pinned, checksummed)
        run: |
          set -euo pipefail
          curl -fsSL -o knope.tgz "https://github.com/knope-dev/knope/releases/download/knope/v0.23.0/knope-x86_64-unknown-linux-musl.tgz"
          echo "76a970a5e237344abc14be3de37ed50c021b659a9b66b3f54afc77e6d48ac501  knope.tgz" | sha256sum -c -
          tar -xzf knope.tgz
          sudo mv knope-x86_64-unknown-linux-musl/knope /usr/local/bin/knope
          knope --version

      - name: configure git identity for the release tag
        run: |
          git config user.name "urzua-release-bot"
          git config user.email "urzua-release-bot@users.noreply.github.com"

      - name: tag and create the GitHub Release (ADR-0045)
        run: knope release --verbose
        env:
          GITHUB_TOKEN: ${{ github.token }}
