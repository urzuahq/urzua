name: prepare release
# Implements: ADR-0029, ADR-0045

# Opens or updates a "release" branch PR on every push to main that has
# something to release -- the compiled version bump and CHANGELOG.md
# section are a real diff, reviewable before anything lands (ADR-0045,
# superseding ADR-0029's single-dispatched-job direct push). Merging that
# PR is the deliberate act; publish-release.yml runs on that merge.
on:
  push:
    branches: [main]

concurrency:
  group: prepare-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare-release:
    # Skip re-triggering on the push this same workflow's own merged PR
    # produces -- there's nothing left to prepare at that point, and
    # without this guard every such push would otherwise fail loudly
    # (PrepareRelease finding no pending changes) rather than just being a
    # no-op.
    if: "!contains(github.event.head_commit.message, 'chore: prepare release')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Pushes the release branch and opens/updates its PR -- narrow and
      # explicit, not the workflow-level default.
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: install knope 0.23.0 (pinned, checksummed)
        run: |
          set -euo pipefail
          curl -fsSL -o knope.tgz "https://github.com/knope-dev/knope/releases/download/knope/v0.23.0/knope-x86_64-unknown-linux-musl.tgz"
          echo "76a970a5e237344abc14be3de37ed50c021b659a9b66b3f54afc77e6d48ac501  knope.tgz" | sha256sum -c -
          tar -xzf knope.tgz
          sudo mv knope-x86_64-unknown-linux-musl/knope /usr/local/bin/knope
          knope --version

      # knope.toml's prepare-release runs `cargo check` to regenerate
      # Cargo.lock after the version bump (BUG-0014), so this job needs a
      # real toolchain and a populated registry -- without them that step
      # cannot resolve any external dependency and knope aborts (BUG-0027).
      - name: install the pinned toolchain (rustup auto-detects rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust

      - name: configure git identity for the release-prep commit
        run: |
          git config user.name "urzua-release-bot"
          git config user.email "urzua-release-bot@users.noreply.github.com"

      # No continue-on-error: the `if:` guard above already skips the one
      # expected no-op case (this workflow's own release commit), so any
      # failure reaching here is real. Swallowing it hid a six-day release
      # outage once (BUG-0027) -- a workflow that reports success while
      # doing nothing is the failure this project exists to prevent.
      - name: open or update the release PR (ADR-0045)
        run: knope prepare-release --verbose
        env:
          GITHUB_TOKEN: ${{ github.token }}
