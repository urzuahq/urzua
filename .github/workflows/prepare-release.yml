name: prepare release
# Implements: ADR-0029, ADR-0045

# Opens or updates a "release" branch PR on every push to main that has
# something to release -- the compiled version bump and CHANGELOG.md
# section are a real diff, reviewable before anything lands (ADR-0045,
# superseding ADR-0029's single-dispatched-job direct push). Merging that
# PR is the deliberate act; publish-release.yml runs on that merge.
on:
  push:
    branches: [main]

concurrency:
  group: prepare-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare-release:
    # Skip re-triggering on the push this same workflow's own merged PR
    # produces -- there's nothing left to prepare at that point, and
    # without this guard every such push would otherwise fail loudly
    # (PrepareRelease finding no pending changes) rather than just being a
    # no-op.
    if: "!startsWith(github.event.head_commit.message, 'chore: prepare release')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # No job-level grant: the workflow's read-only default stands. Everything
    # that writes (the branch push, the pull request, its label) uses the App
    # token below, whose scope is set where it is minted. A write grant on
    # GITHUB_TOKEN here would be one nothing uses.
    steps:
      # The release branch and PR must be pushed and opened by a GitHub App, not
      # GITHUB_TOKEN: GitHub starts no workflow run from a GITHUB_TOKEN event, so
      # `ci` (a required check on main) would never run on the release PR. There
      # is deliberately no fallback to GITHUB_TOKEN.
      - name: require the release app secrets
        env:
          APP_CLIENT_ID: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          APP_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_CLIENT_ID" ] || [ -z "$APP_KEY" ]; then
            echo "::error::RELEASE_APP_CLIENT_ID and RELEASE_APP_PRIVATE_KEY must be set as repository secrets so the release PR is opened by a GitHub App and CI runs on it; see the maintainer setup steps for branch protection"
            exit 1
          fi
      - id: app-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # Only what this job does: push the release branch (contents) and
          # open and label its pull request (pull requests). The token is
          # narrower than the App's installation, because this job runs
          # repository code (`cargo check`, `harness update`) with it in
          # `.git/config`.
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      # The pin and its checksum live in one place (.github/actions/install-knope).
      - uses: ./.github/actions/install-knope

      # knope.toml's prepare-release runs `cargo check` to regenerate
      # Cargo.lock after the version bump (BUG-0014), so this job needs a
      # real toolchain and a populated registry -- without them that step
      # cannot resolve any external dependency and knope aborts (BUG-0027).
      - name: install the pinned toolchain (rustup auto-detects rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust

      - name: configure git identity for the release-prep commit
        run: |
          git config user.name "urzua-release-bot"
          git config user.email "urzua-release-bot@users.noreply.github.com"

      # Deliberately not `continue-on-error`, which swallowed a six-day
      # release outage once (BUG-0027). This tolerates exactly one documented
      # error -- knope's own `releases::no_release`, which a merge carrying no
      # changeset and no releasable commit legitimately produces (BUG-0033) --
      # and fails on anything else, including a future knope that stops
      # emitting that identifier.
      - name: open or update the release PR (ADR-0045)
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -uo pipefail
          out=$(knope prepare-release --verbose 2>&1) && rc=0 || rc=$?
          printf '%s\n' "$out"
          if [ "$rc" -eq 0 ]; then
            exit 0
          fi
          # Extracted so it can be exercised: .github/scripts/release-guard.test.sh
          # plants an unmatched-package fragment and asserts a nonzero exit.
          .github/scripts/release-guard.sh .changeset "$out"
          case $? in
            0) exit 0 ;;
            1) exit 1 ;;
            *) echo "::error::knope prepare-release failed (exit $rc)"; exit "$rc" ;;
          esac
