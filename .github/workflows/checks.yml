name: checks
# Implements: ADR-0047

# The build/test/self-host gate, in one place so `ci` (on a PR) and
# `publish-release` (on the tag being shipped) run the same definition rather
# than two that can drift (ADR-0047).
on:
  workflow_call:
    inputs:
      ref:
        description: The ref to check out. Defaults to the triggering ref.
        required: false
        type: string

permissions:
  contents: read

jobs:
  rust:
    name: rust (fmt, clippy, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # The gate's one updating comment on a pull request. A caller must grant
      # at least this; a token that cannot write (a fork) only loses the
      # comment, never the verdict.
      pull-requests: write
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
          # embodiment.consistency's drift check (ADR-0032) reads git blame/log
          # history on locators -- a shallow checkout makes it silently unable
          # to detect anything, not an error, so this is load-bearing.
          fetch-depth: 0
      - name: install the pinned toolchain (rustup auto-detects rust-toolchain.toml)
        run: |
          rustup show
          rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Supply-chain and unused-dependency gates (MILE-176). Pinned prebuilt
      # binaries with a checksum, so CI does not compile them on every run.
      - name: install cargo-deny and cargo-machete (pinned, checksummed)
        working-directory: .
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tools" && cd "$RUNNER_TEMP/tools"
          curl -sSLfo deny.tgz https://github.com/EmbarkStudios/cargo-deny/releases/download/0.19.4/cargo-deny-0.19.4-x86_64-unknown-linux-musl.tar.gz
          curl -sSLfo machete.tgz https://github.com/bnjbvr/cargo-machete/releases/download/v0.9.1/cargo-machete-v0.9.1-x86_64-unknown-linux-musl.tar.gz
          echo "3bd58b784e83715b86ddbc9deac591890372ec77fda5741bb0826970b958506f  deny.tgz" | sha256sum -c -
          echo "640b0814480b401e4e72201e52a13e1311b8eb8d7c27faa08bbe9886f252f26d  machete.tgz" | sha256sum -c -
          tar -xzf deny.tgz --strip-components=1 --wildcards '*/cargo-deny'
          tar -xzf machete.tgz --strip-components=1 --wildcards '*/cargo-machete'
          echo "$PWD" >> "$GITHUB_PATH"
      - name: cargo machete (unused dependencies)
        run: cargo machete
      - name: cargo deny (advisories, bans, licenses, sources)
        run: cargo deny check
      # The release tool must tolerate the structured claim field a changeset
      # fragment carries (`closes`). The pin and checksum are the release
      # workflows'; the test reads the pin from prepare-release.yml and fails if
      # the installed version differs, so a knope upgrade re-runs it.
      - name: install knope 0.23.0 (pinned, checksummed)
        working-directory: .
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/knope" && cd "$RUNNER_TEMP/knope"
          curl -fsSL -o knope.tgz "https://github.com/knope-dev/knope/releases/download/knope/v0.23.0/knope-x86_64-unknown-linux-musl.tgz"
          echo "76a970a5e237344abc14be3de37ed50c021b659a9b66b3f54afc77e6d48ac501  knope.tgz" | sha256sum -c -
          tar -xzf knope.tgz
          echo "$PWD/knope-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
      - name: knope tolerates the closes key (ADR-85)
        working-directory: .
        run: .github/scripts/knope-closes-compat.test.sh
      - name: cargo build --release
        run: cargo build --workspace --release --locked
      # The tests run under a fresh TMPDIR, and the run fails when any urzua-*
      # fixture directory is left in it (BUG-193). The guard's own
      # planted-violation cases run first.
      - name: cargo test (and no leaked fixture directories)
        working-directory: .
        run: |
          .github/scripts/test-no-leak.test.sh
          .github/scripts/test-no-leak.sh
      # The records gate is the reusable unit other repositories adopt
      # (MILE-180), run here against the binary just built: `urzua check`, and
      # on a pull request `urzua check --base` against the PR base, reported as
      # annotations and one updating comment. The unit also verifies that the
      # history it needs is present (fetch-depth: 0 above), so a shallow
      # checkout fails with a reason instead of reading clean (ADR-71).
      # base-ref is empty outside pull requests (publish-release calls this
      # workflow on a tag), where only the whole-tree check runs.
      - name: urzua gate (SPEC-0002 Phase A exit criterion -- self-hosting)
        uses: ./.github/actions/urzua-gate
        with:
          binary: rust/target/release/urzua
          base-ref: ${{ github.base_ref }}
          pr-number: ${{ github.event.pull_request.number }}
