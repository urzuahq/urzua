name: checks
# Implements: ADR-0047

# The build/test/self-host gate, in one place so `ci` (on a PR) and
# `publish-release` (on the tag being shipped) run the same definition rather
# than two that can drift (ADR-0047).
on:
  workflow_call:
    inputs:
      ref:
        description: The ref to check out. Defaults to the triggering ref.
        required: false
        type: string
      comment:
        description: >-
          "false" keeps the gate from posting its pull request comment. The
          caller still has to grant `pull-requests: write`, which this
          workflow's job asks for.
        required: false
        type: string
        default: "true"

permissions:
  contents: read

jobs:
  rust:
    name: rust (fmt, clippy, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # The gate's one updating comment on a pull request. A caller must grant
      # at least this; a token that cannot write (a fork) only loses the
      # comment, never the verdict.
      pull-requests: write
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
          # embodiment.consistency's drift check (ADR-0032) reads git blame/log
          # history on locators -- a shallow checkout makes it silently unable
          # to detect anything, not an error, so this is load-bearing.
          fetch-depth: 0
      - name: install the pinned toolchain (rustup auto-detects rust-toolchain.toml)
        run: |
          rustup show
          rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Supply-chain and unused-dependency gates (MILE-176). Pinned prebuilt
      # binaries with a checksum, so CI does not compile them on every run.
      - name: install cargo-deny and cargo-machete (pinned, checksummed)
        working-directory: .
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tools" && cd "$RUNNER_TEMP/tools"
          curl -sSLfo deny.tgz https://github.com/EmbarkStudios/cargo-deny/releases/download/0.19.4/cargo-deny-0.19.4-x86_64-unknown-linux-musl.tar.gz
          curl -sSLfo machete.tgz https://github.com/bnjbvr/cargo-machete/releases/download/v0.9.1/cargo-machete-v0.9.1-x86_64-unknown-linux-musl.tar.gz
          echo "3bd58b784e83715b86ddbc9deac591890372ec77fda5741bb0826970b958506f  deny.tgz" | sha256sum -c -
          echo "640b0814480b401e4e72201e52a13e1311b8eb8d7c27faa08bbe9886f252f26d  machete.tgz" | sha256sum -c -
          tar -xzf deny.tgz --strip-components=1 --wildcards '*/cargo-deny'
          tar -xzf machete.tgz --strip-components=1 --wildcards '*/cargo-machete'
          echo "$PWD" >> "$GITHUB_PATH"
      - name: cargo machete (unused dependencies)
        run: cargo machete
      - name: cargo deny (advisories, bans, licenses, sources)
        run: cargo deny check
      # The release tool must tolerate the structured claim field a changeset
      # fragment carries (`closes`). The pin and checksum are written once, in
      # .github/actions/install-knope, which the two release workflows use too;
      # the pin test fails when a workflow carries its own copy, and the compat
      # test reads the version from the action and fails if the installed one
      # differs, so a knope upgrade re-runs it.
      - uses: ./.github/actions/install-knope
      - name: knope is pinned in one place
        working-directory: .
        run: .github/scripts/knope-pin.test.sh
      - name: knope tolerates the closes key (ADR-85)
        working-directory: .
        run: .github/scripts/knope-closes-compat.test.sh
      - name: cargo build --release
        run: cargo build --workspace --release --locked
      # Guards that previously ran only under `make ci`, so a stale rule table or
      # a broken release guard passed CI, and publish-release's pre-tag gate
      # skipped the release invariants.
      - name: release guard planted-violation cases
        working-directory: .
        run: .github/scripts/release-guard.test.sh
      - name: release invariants planted-violation cases
        working-directory: .
        run: .github/scripts/release-invariants.test.sh
      - name: release invariants on this ref
        working-directory: .
        run: |
          .github/scripts/release-invariants.sh \
            .changeset rust/Cargo.toml "$(git tag --sort=-v:refname | head -1)"
      - name: SPEC-2 rule table is current
        working-directory: .
        run: make rule-table-check
      # The tests run under a fresh TMPDIR, and the run fails when any urzua-*
      # fixture directory is left in it (BUG-193). The guard's own
      # planted-violation cases run first.
      - name: cargo test (and no leaked fixture directories)
        working-directory: .
        run: |
          .github/scripts/test-no-leak.test.sh
          .github/scripts/test-no-leak.sh
      # The records gate is the reusable unit other repositories adopt
      # (MILE-180), run here against the binary just built: `urzua check`, and
      # on a pull request `urzua check --base` against the PR base, reported as
      # annotations and one updating comment. The unit also verifies that the
      # history it needs is present (fetch-depth: 0 above), so a shallow
      # checkout fails with a reason instead of reading clean (ADR-71).
      # base-ref is empty on a push and on a tag (publish-release calls this
      # workflow with a ref), where only the whole-tree check runs. On a pull
      # request it is the base branch; in a merge queue it is the branch the
      # queued commit will land on (the event carries it as a full ref), so
      # the diff rules run for the commit that is about to merge, not only
      # for the pull request that was reviewed.
      # identity.open-pr-collision (ADR-93) compares an added record with the
      # pull-request head refs `urzua new` fetches; `check` never fetches, so the
      # gate does, with plain git, into the same private namespace.
      - name: fetch pull request refs (identity.open-pr-collision)
        working-directory: .
        run: git fetch --no-tags --quiet origin '+refs/pull/*/head:refs/urzua/pr/origin/*'
      # The branch the gate diffs against. Expressions have no string replace,
      # so the merge queue's full ref is trimmed here, with both values passed
      # through the environment.
      - name: resolve the base branch for the diff rules
        id: base
        working-directory: .
        env:
          PR_BASE: ${{ github.base_ref }}
          QUEUE_BASE: ${{ github.event.merge_group.base_ref }}
        run: echo "ref=${PR_BASE:-${QUEUE_BASE#refs/heads/}}" >> "$GITHUB_OUTPUT"
      - name: urzua gate (SPEC-0002 Phase A exit criterion -- self-hosting)
        uses: ./.github/actions/urzua-gate
        with:
          binary: rust/target/release/urzua
          base-ref: ${{ steps.base.outputs.ref }}
          pr-number: ${{ github.event.pull_request.number }}
          comment: ${{ inputs.comment }}
          # The authority table (ADR-89 section 4): the pull request's author and
          # current approvers, for diff.decider-required.
          actors: "true"

      # The installed agent-harness bundle (hooks, commands, lock) has not drifted from
      # what `urzua harness install` generates: a deleted hook entry or an edited
      # translator fails here, not only in a cargo test.
      - name: urzua harness status (no drift)
        working-directory: .
        run: rust/target/release/urzua harness status
