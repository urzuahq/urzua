name: checks
# Implements: ADR-0047

# The build/test/self-host gate, in one place so `ci` (on a PR) and
# `publish-release` (on the tag being shipped) run the same definition rather
# than two that can drift (ADR-0047).
on:
  workflow_call:
    inputs:
      ref:
        description: The ref to check out. Defaults to the triggering ref.
        required: false
        type: string

permissions:
  contents: read

jobs:
  rust:
    name: rust (fmt, clippy, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
          # embodiment.consistency's drift check (ADR-0032) reads git blame/log
          # history on locators -- a shallow checkout makes it silently unable
          # to detect anything, not an error, so this is load-bearing.
          fetch-depth: 0
      - name: install the pinned toolchain (rustup auto-detects rust-toolchain.toml)
        run: |
          rustup show
          rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Supply-chain and unused-dependency gates (MILE-176). Pinned prebuilt
      # binaries with a checksum, so CI does not compile them on every run.
      - name: install cargo-deny and cargo-machete (pinned, checksummed)
        working-directory: .
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tools" && cd "$RUNNER_TEMP/tools"
          curl -sSLfo deny.tgz https://github.com/EmbarkStudios/cargo-deny/releases/download/0.18.5/cargo-deny-0.18.5-x86_64-unknown-linux-musl.tar.gz
          curl -sSLfo machete.tgz https://github.com/bnjbvr/cargo-machete/releases/download/v0.9.1/cargo-machete-v0.9.1-x86_64-unknown-linux-musl.tar.gz
          echo "3e139780452310f922239f683b5c14f7d8f6f9b97fcc08d30696e1b90158527c  deny.tgz" | sha256sum -c -
          echo "640b0814480b401e4e72201e52a13e1311b8eb8d7c27faa08bbe9886f252f26d  machete.tgz" | sha256sum -c -
          tar -xzf deny.tgz --strip-components=1 --wildcards '*/cargo-deny'
          tar -xzf machete.tgz --strip-components=1 --wildcards '*/cargo-machete'
          echo "$PWD" >> "$GITHUB_PATH"
      - name: cargo machete (unused dependencies)
        run: cargo machete
      - name: cargo deny (advisories, bans, licenses, sources)
        run: cargo deny check
      - name: cargo build --release
        run: cargo build --workspace --release --locked
      - name: cargo test
        run: cargo test --workspace --locked
      - name: urzua check (SPEC-0002 Phase A exit criterion -- self-hosting)
        working-directory: .
        run: rust/target/release/urzua check
      # The diff-aware gate (MILE-123/124): on a PR, report only on what the PR
      # changed against its base, and enforce the diff.* rules, which have
      # nothing to judge on a whole-repo run. fetch-depth: 0 above brings the
      # history; the explicit fetch guarantees the base branch ref exists.
      # Only the `ci` workflow's pull_request trigger sets base_ref.
      - name: urzua check --base (diff gate, pull requests only)
        if: github.event_name == 'pull_request'
        working-directory: .
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          rust/target/release/urzua check --base "origin/${BASE_REF}"
