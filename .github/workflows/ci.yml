name: ci

# Deliberately unfiltered: no `branches:` restriction and no workflow-level
# `paths:` filter. A filtered required check can fail to report on a PR that
# doesn't touch the filtered paths, which deadlocks a merge that requires it.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: rust (fmt, clippy, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install the pinned toolchain (rustup auto-detects rust-toolchain.toml)
        run: |
          rustup show
          rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: cargo build --release
        run: cargo build --workspace --release --locked
      - name: cargo test
        run: cargo test --workspace --locked
      - name: urzua check docs/ (SPEC-0002 Phase A exit criterion -- self-hosting)
        working-directory: .
        run: rust/target/release/urzua check docs/

  changeset:
    name: changeset required
    # A `no-changeset` label is an explicit, visible opt-out (CI-only, docs-only,
    # internal-refactor PRs) -- never a silent skip (ADR-0029).
    if: >-
      github.event_name == 'pull_request' &&
      !contains(github.event.pull_request.labels.*.name, 'no-changeset')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: verify this PR adds a .changeset fragment (ADR-0029)
        run: |
          set -euo pipefail
          git fetch origin "${{ github.event.pull_request.base.ref }}" --depth=1
          added=$(git diff --name-only --diff-filter=A "origin/${{ github.event.pull_request.base.ref }}"...HEAD -- '.changeset/*.md' || true)
          if [ -z "$added" ]; then
            echo "no .changeset/*.md fragment added -- run 'knope document-change', or label this PR 'no-changeset' if there's nothing to tell an installer"
            exit 1
          fi
          echo "found: $added"

  ci:
    name: ci
    needs: [rust, changeset]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    if: always()
    steps:
      - name: fail if any required job failed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || \
             [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "one or more required jobs did not succeed"
            exit 1
          fi
