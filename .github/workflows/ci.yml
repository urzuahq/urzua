name: ci

# Deliberately unfiltered: no `branches:` restriction and no workflow-level
# `paths:` filter. A filtered required check can fail to report on a PR that
# doesn't touch the filtered paths, which deadlocks a merge that requires it.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: rust (fmt, clippy, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install the pinned toolchain (rustup auto-detects rust-toolchain.toml)
        run: |
          rustup show
          rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: cargo build --release
        run: cargo build --workspace --release --locked
      - name: cargo test
        run: cargo test --workspace --locked

  ci:
    name: ci
    needs: [rust]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    if: always()
    steps:
      - name: fail if any required job failed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || \
             [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "one or more required jobs did not succeed"
            exit 1
          fi
