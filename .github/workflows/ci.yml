name: ci

# Deliberately unfiltered: no `branches:` restriction and no workflow-level
# `paths:` filter. A filtered required check can fail to report on a PR that
# doesn't touch the filtered paths, which deadlocks a merge that requires it.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: rust (fmt, clippy, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install the pinned toolchain (rustup auto-detects rust-toolchain.toml)
        run: |
          rustup show
          rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: cargo build --release
        run: cargo build --workspace --release --locked
      - name: cargo test
        run: cargo test --workspace --locked
      - name: urzua check docs/ (SPEC-0002 Phase A exit criterion -- self-hosting)
        working-directory: .
        run: rust/target/release/urzua check docs/

  changelog:
    name: changelog lockstep
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: verify a version bump carries a matching CHANGELOG.md entry (ADR-0028)
        run: |
          set -euo pipefail
          git fetch origin "${{ github.event.pull_request.base.ref }}" --depth=1
          old_version=$(git show "origin/${{ github.event.pull_request.base.ref }}:rust/Cargo.toml" | grep -m1 '^version = ' | sed -E 's/version = "(.*)"/\1/')
          new_version=$(grep -m1 '^version = ' rust/Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          if [ "$old_version" = "$new_version" ]; then
            echo "version unchanged ($new_version) -- no changelog entry required"
            exit 0
          fi
          if ! grep -qF "## [$new_version]" CHANGELOG.md; then
            echo "version bumped $old_version -> $new_version but CHANGELOG.md has no '## [$new_version]' entry"
            exit 1
          fi
          echo "CHANGELOG.md carries an entry for $new_version"

  ci:
    name: ci
    needs: [rust, changelog]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    if: always()
    steps:
      - name: fail if any required job failed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || \
             [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "one or more required jobs did not succeed"
            exit 1
          fi
