name: ci
# Implements: ADR-0029, ADR-0047

# Deliberately unfiltered: no `branches:` restriction and no workflow-level
# `paths:` filter. A filtered required check can fail to report on a PR that
# doesn't touch the filtered paths, which deadlocks a merge that requires it.
# `labeled`/`unlabeled` added to the default [opened, synchronize, reopened]
# set (BUG-0015). Still load-bearing: the `changeset` job reads the label live
# rather than from the event payload (BUG-0034), which fixes a *stale* payload
# but not a label applied *after* the run started -- that run correctly sees no
# label and fails, and only a `labeled` event starts the correcting one.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Shared with publish-release.yml, which runs the same definition against the
  # tag it is about to ship rather than asking whether this workflow ran
  # (ADR-0047).
  rust:
    uses: ./.github/workflows/checks.yml

  changeset:
    name: changeset required
    # A `no-changeset` label is an explicit, visible opt-out (CI-only, docs-only,
    # internal-refactor PRs) -- never a silent skip (ADR-0029).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # A PR touching nothing an installer receives cannot need a changelog
      # entry, so it is not asked for one (ADR-0049). The paths are declared in
      # .github/release-paths rather than inlined here, so there is one place to
      # change when the release surface does.
      - name: does this PR touch what an installer receives?
        id: scope
        run: |
          set -euo pipefail
          git fetch origin "${{ github.event.pull_request.base.ref }}" --depth=1
          changed=$(git diff --name-only "origin/${{ github.event.pull_request.base.ref }}"...HEAD)
          while IFS= read -r prefix; do
            case "$prefix" in ''|\#*) continue ;; esac
            if printf '%s\n' "$changed" | grep -q "^$(printf '%s' "$prefix" | sed 's/[][\.*^$/]/\\&/g')"; then
              echo "touches $prefix -- a changelog entry may be needed"
              echo "affects=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done < .github/release-paths
          echo "nothing an installer receives changed -- no changeset needed"

      # Read the label from the PR, not from `github.event`. The payload is a
      # snapshot taken when the event fired, and a PR opened by automation is
      # labelled in a later step -- so the payload never carries it, and a
      # re-run replays the same stale snapshot (BUG-0034).
      - name: check for the no-changeset opt-out
        if: steps.scope.outputs.affects == 'true'
        id: optout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh pr view "${{ github.event.pull_request.number }}" \
               --repo "${{ github.repository }}" --json labels \
               --jq '.labels[].name' | grep -qx 'no-changeset'; then
            echo "no-changeset label present -- this PR declares it has nothing to tell an installer"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      # Both conditions, not just the opt-out: a skipped `optout` step leaves
      # its output empty, and an empty string is not 'true', so keying on the
      # opt-out alone would run this on exactly the PRs the scope step exempted.
      - name: verify this PR adds a .changeset fragment (ADR-0029)
        if: steps.scope.outputs.affects == 'true' && steps.optout.outputs.skip != 'true'
        run: |
          set -euo pipefail
          git fetch origin "${{ github.event.pull_request.base.ref }}" --depth=1
          added=$(git diff --name-only --diff-filter=A "origin/${{ github.event.pull_request.base.ref }}"...HEAD -- '.changeset/*.md' || true)
          if [ -z "$added" ]; then
            echo "no .changeset/*.md fragment added -- run 'knope document-change', or label this PR 'no-changeset' if there's nothing to tell an installer"
            exit 1
          fi
          echo "found: $added"

  release-invariants:
    name: release invariants
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # Full history and tags: the guard compares the manifest version against
      # the newest tag, and a shallow checkout has neither.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # BUG-93. Both defects it guards against reached main unattended, and
      # `make ci` only runs when a human runs it -- which was not in either
      # path. A guard that fires only where the failure did not happen is a
      # check reporting success without looking (ADR-55).
      - name: planted-violation cases
        run: .github/scripts/release-invariants.test.sh
      - name: check the invariants on this ref
        run: |
          .github/scripts/release-invariants.sh \
            .changeset rust/Cargo.toml "$(git tag --sort=-v:refname | head -1)"

  ci:
    name: ci
    needs: [rust, changeset, release-invariants]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    if: always()
    steps:
      - name: fail if any required job failed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || \
             [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "one or more required jobs did not succeed"
            exit 1
          fi
