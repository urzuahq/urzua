name: install nextest
description: >-
  Installs the pinned cargo-nextest release, verified against its SHA-256, and
  puts it on PATH. The one place the nextest version and checksum are written:
  the checks workflow uses this action, and .github/scripts/nextest-pin.test.sh
  fails when a workflow carries its own copy of the pin. An upgrade is a change
  to this file alone.

runs:
  using: composite
  steps:
    - name: install cargo-nextest 0.9.151 (pinned, checksummed)
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/nextest" && cd "$RUNNER_TEMP/nextest"
        curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o nextest.tgz "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.151/cargo-nextest-0.9.151-x86_64-unknown-linux-musl.tar.gz"
        echo "6b284d6fde9670dfb6ee10ea9d9abbc85f95643d3f592472d420d82e257b3a6c  nextest.tgz" | sha256sum -c -
        tar -xzf nextest.tgz
        echo "$PWD" >> "$GITHUB_PATH"
        "$PWD/cargo-nextest" nextest --version
