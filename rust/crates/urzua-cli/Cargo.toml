[package]
name = "urzua-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The binary is `urzua` regardless of the crate name — it is what users type.
[[bin]]
name = "urzua"
path = "src/main.rs"

# The test seams (a stand-in engine for the agent hook) exist only in a build
# whose dev-dependencies are active, `cargo test`: the dev-dependency on this
# package turns the feature on there and nowhere else, so neither `cargo build`
# nor `cargo install` nor a release archive carries it.
[features]
test-seams = []

[lib]
path = "src/lib.rs"

[dependencies]
urzua-core = { workspace = true }
urzua-io = { workspace = true }
urzua-id = { workspace = true }
urzua-mcp = { workspace = true }
clap = { workspace = true }
yaml_serde = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# SPEC-4's corpus acceptance suite. A custom harness so the per-case report
# (and the private-corpus skip note) is always printed, not captured away by
# libtest on a passing run.
[[test]]
name = "acceptance"
harness = false

[dev-dependencies]
urzua-cli = { path = ".", features = ["test-seams"] }
regex = { workspace = true }
