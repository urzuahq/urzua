id: a-test-copy-dropped-beside-its-code-copy-fails-check-base
corpus: corpus-g
bugs: [BUG-227]
# The base cites src/cache.rs as code and as test at one hash; the head drops the
# test citation with no row. The code citation is not the same evidence, so the
# drop is a removal and not a collapsed duplicate.
commits:
  - write:
      .urzua/config.yaml: "schema_version: 2\nfail_on: warning\nrecord_types:\n  adr:\n    dir: records\n    prefix: ADR\n    required_fields: [Status, Embodiment, Realized-by]\n    header_shape: yaml-frontmatter\nrules:\n  diff.pin-changed-unattested: off\n  embodiment.consistency: warn\n  embodiment.locator-exists: error\n  embodiment.back-pointer-resolution:\n    level: error\n    back_pointer_paths: [src]\n  code.dangling-bug-reference:\n    level: error\n    back_pointer_paths: [src]\n    extensions: [rs]\n"
      records/ADR-0013-test-copy-dropped.md: "---\nStatus: Accepted\nEmbodiment: Implemented\nRealized-by: code:src/cache.rs@sha256:2222222222222222222222222222222222222222222222222222222222222222, test:src/cache.rs@sha256:2222222222222222222222222222222222222222222222222222222222222222\n---\n# ADR-0013 \u2014 Test copy dropped\n"
  - write:
      .urzua/config.yaml: "schema_version: 2\nfail_on: warning\nrecord_types:\n  adr:\n    dir: records\n    prefix: ADR\n    required_fields: [Status, Embodiment, Realized-by]\n    header_shape: yaml-frontmatter\nrules:\n  diff.pin-changed-unattested: error\n  embodiment.consistency: warn\n  embodiment.locator-exists: error\n  embodiment.back-pointer-resolution:\n    level: error\n    back_pointer_paths: [src]\n  code.dangling-bug-reference:\n    level: error\n    back_pointer_paths: [src]\n    extensions: [rs]\n"
      records/ADR-0013-test-copy-dropped.md: "---\nStatus: Accepted\nEmbodiment: Implemented\nRealized-by: code:src/cache.rs@sha256:2222222222222222222222222222222222222222222222222222222222222222\n---\n# ADR-0013 \u2014 Test copy dropped\n"
invocation: [check, --base, HEAD~1]
expect_exit: 1
expect_findings:
  - rule: diff.pin-changed-unattested
    file: records/ADR-0013-test-copy-dropped.md
    severity: error
    message_contains: "the pin on 'src/cache.rs' was removed"
