      records/MILE-3-m3.md: "---\nStatus: Planned\nPhase: 0\nDepends-on: MILE-2\n---\n# MILE-3 — m3\n"
      records/MILE-4-m4.md: "---\nStatus: Planned\nPhase: 0\nDepends-on: MILE-3\n---\n# MILE-4 — m4\n"
      records/MILE-5-m5.md: "---\nStatus: Planned\nPhase: 0\nDepends-on: MILE-3\n---\n# MILE-5 — m5\n"
      records/MILE-6-m6.md: "---\nStatus: Planned\nPhase: 0\n---\n# MILE-6 — m6\n"
invocation: [roadmap]
expect_exit: 0
expect_json:
