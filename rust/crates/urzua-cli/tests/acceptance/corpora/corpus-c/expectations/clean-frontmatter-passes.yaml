id: clean-frontmatter-passes
corpus: corpus-c
invocation: [check, records/]
expect_exit: 0
expect_json:
  - {at: /status, equals: ok}
  - {at: /files_examined, equals: 3}
expect_no_findings:
  - {severity: error}
  - {severity: warning}
mutation_exempt: a positive control; it asserts that nothing fires, which no rule's absence changes.
