schema_version: 2
fail_on: warning
record_types:
  adr:
    dir: records
    prefix: ADR
    required_fields: [Status]
    header_shape: yaml-frontmatter
    statuses:
      values: [Proposed, Accepted, Superseded, Lost]
      success: [Accepted]
      failure: [Superseded, Lost]
      initial: [Proposed]
      transitions:
        Proposed: [Accepted]
        Accepted: [Superseded]
rules:
  header.required-fields: error
  status.unreachable-state: warn
