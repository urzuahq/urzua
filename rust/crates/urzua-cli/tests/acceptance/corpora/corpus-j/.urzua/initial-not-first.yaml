schema_version: 2
record_types:
  adr:
    dir: records
    prefix: ADR
    required_fields: [Status]
    header_shape: yaml-frontmatter
    statuses:
      values: [Accepted, Proposed, Superseded]
      success: [Accepted]
      failure: [Superseded]
      initial: [Proposed]
      transitions:
        Proposed: [Accepted]
        Accepted: [Superseded]
rules:
  header.required-fields: error
