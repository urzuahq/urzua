id: a-terminal-status-cannot-be-left
corpus: corpus-j
commits:
  - write:
      records/ADR-0003-superseded.md: "---\nStatus: Accepted\n---\n# ADR-0003 \u2014 Leaves a terminal status\n\nEdited.\n"
invocation: [check, --base, base]
expect_exit: 1
expect_findings:
  - rule: status.transition-allowed
    file: records/ADR-0003-superseded.md
    message_contains: "terminal"
