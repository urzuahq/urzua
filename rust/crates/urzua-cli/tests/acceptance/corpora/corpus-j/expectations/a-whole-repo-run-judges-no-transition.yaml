id: a-whole-repo-run-judges-no-transition
corpus: corpus-j
# There is no committed side without --base, so the rule reports not-applicable
# rather than a pass it cannot have earned.
invocation: [check]
expect_exit: 0
expect_stdout_contains:
  # The population line pins this to status.transition-allowed: the
  # default-on diff rule also reports not-applicable, with no population.
  - "\"unreadable\": 0\n      },\n      \"status\": \"not-applicable\""
proves:
  - status.transition-allowed
