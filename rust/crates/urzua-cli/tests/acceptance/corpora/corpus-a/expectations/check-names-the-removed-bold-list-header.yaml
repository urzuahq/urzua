id: check-names-the-removed-bold-list-header
corpus: corpus-a
invocation: [--config, .urzua/declared-yaml.yaml, check, records/]
expect_exit: 1
expect_findings:
  - {rule: header.required-fields, severity: error}
expect_stdout_contains:
  - "written as a bold-list"
  - "no longer reads"
mutation_exempt: >-
  header.required-fields is the only rule this config enables, so switching it
  off leaves a config with no rule, which is rejected rather than missed.
