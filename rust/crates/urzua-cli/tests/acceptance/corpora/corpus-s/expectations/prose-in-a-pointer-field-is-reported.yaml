id: prose-in-a-pointer-field-is-reported
bugs: [BUG-7]
corpus: corpus-s
invocation: [check]
# ADR-5's Implements holds `ADR-2 (see the thread)`, prose after the reference, in a field that holds only reference ids.
expect_exit: 1
# BUG-7 filed the rule as a Warning; this corpus's config declares header.pointer-field-clean at error (a repository's own
# declared level), so the finding is an error and the run exits 1.
expect_findings:
  - {rule: header.pointer-field-clean, severity: error, file: docs/adr/ADR-5-prose-pointer.md, message_contains: "clean reference"}
expect_no_findings:
  - {rule: header.pointer-field-clean, file: docs/adr/ADR-3-leans-on-old.md}
