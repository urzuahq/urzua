schema_version: 2
rules:
  header.required-fields: error
  config.companion-declaration-missing: error
record_types:
  note:
    dir: records
    prefix: NOTE
    header_shape: yaml-frontmatter
    required_fields: [Status, Embodiment]
    known_fields: [Status, Embodiment, Owner]
    pointer_fields: []
    narrative_fields: []
    companion_fields:
      - [embodiment_state, embodiment_locator]
