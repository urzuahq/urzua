schema_version: 2
rules:
  header.required-fields: error
  config.relation-field-not-known: error
record_types:
  note:
    dir: records
    prefix: NOTE
    header_shape: yaml-frontmatter
    required_fields: [Status]
    known_fields: [Status, Owner]
    pointer_fields: []
    narrative_fields: []
    relation_fields:
      status: State
