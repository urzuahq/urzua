schema_version: 2
rules:
  header.required-fields: error
  config.pointer-narrative-overlap: error
record_types:
  note:
    dir: records
    prefix: NOTE
    header_shape: yaml-frontmatter
    required_fields: [Status]
    known_fields: [Status, Owner, Blocked-on]
    pointer_fields: [Blocked-on]
    narrative_fields: [Blocked-on]
