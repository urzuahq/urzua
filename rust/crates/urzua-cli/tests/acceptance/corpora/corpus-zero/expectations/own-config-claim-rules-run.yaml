id: own-config-claim-rules-run
corpus: "@repo"
invocation: [--as-of, "2026-11-09", check]
# This repository's own .urzua/config.yaml over its own records: every rule of
# the claim family that the config enables runs over a non-empty population, and
# the whole check is clean (fail_on: warning). A refactor of the rule wiring
# that drops, silences or newly flags any of them fails here.
expect_exit: 0
expect_json:
  - {at: /blocking, equals: false}
expect_rules_ran:
  - claim.status-agreement
# The claim rule examines one claim per id a changeset fragment lists under
# `closes`, so a fragment that closes nothing (`closes: []`) adds none, and the
# release deletes the rest: on the release tree, or on a pull request whose only
# fragment closes nothing, it runs over none. While any fragment lists a closed
# id the population must still be non-empty.
empty_population_ok_without:
  - {rule: claim.status-agreement, under: .changeset, extension: md, with_key: closes}
