id: own-corpus-findings-declare-their-action
corpus: "@repo"
invocation: [check]
# This repository's own corpus over its own configuration (`ADR-73`, `MILE-44`).
# Its only findings are the waived `citation.resolution` ones, and that variant
# is declared exempt (a prose edit located by line, no action kind yet), so the
# run must list them with no `suggested_action` key. The case fails the day the
# declaration changes, which is when this record's expectation should change on
# purpose. The shape of the action itself is proved on the planted corpora.
expect_exit: 0
expect_json:
  - {at: /blocking, equals: false}
expect_findings:
  - {rule: citation.resolution, no_suggested_action: true}
expect_rules_ran:
  - citation.resolution
