id: own-corpus-findings-declare-their-action
corpus: "@repo"
invocation: [--as-of, "2026-11-09", check]
# This repository's own corpus over its own configuration (`ADR-73`, `MILE-44`).
# The `embodiment.locator-on-back-pointer-path` nudges used to be listed here, to
# prove that their exempt variant carries no `suggested_action`. The rule now
# declares `scope: changed` (`ADR-90`), so a plain `check` judges none of its
# slots and lists no finding; the rule still runs, and its population says how
# many it deferred. That its findings carry no action is proved on planted
# corpora (`locator_mechanism_integration.rs`), and the table-wide coverage of
# `ADR-73` by the action tests; corpus-g runs the nudge under `--base`. What this
# run still lists are the waived `status.delivery-agreement` findings of the
# `delivery-without-evidence` variant, declared exempt, so they must carry no
# `suggested_action` key: the case still fails the day that declaration changes.
# The matcher names the message and not the rule: `statuses.delivery.items` is on
# for `milestone` (`ADR-96`, `MILE-215`), so switching `status.delivery-agreement`
# off makes this repository's config invalid (exit 2) and the mutation proof could
# not run. That rule has its failing cases in corpus-h and corpus-v.
expect_exit: 0
expect_json:
  - {at: /blocking, equals: false}
expect_findings:
  - {severity: error, message_contains: "from no evidence", no_suggested_action: true}
expect_rules_ran:
  - citation.resolution
