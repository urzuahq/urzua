id: own-config-status-rules-run
corpus: "@repo"
invocation: [check]
# This repository's own .urzua/config.yaml over its own records: every rule of
# the status family that the config enables runs over a non-empty population, and
# the whole check is clean (fail_on: warning). A refactor of the rule wiring
# that drops, silences or newly flags any of them fails here.
expect_exit: 0
expect_json:
  - {at: /blocking, equals: false}
expect_rules_ran:
  - status.undeclared-value
  - status.required-field-missing
  - status.done-items-shape
  - status.waived-item-stale
