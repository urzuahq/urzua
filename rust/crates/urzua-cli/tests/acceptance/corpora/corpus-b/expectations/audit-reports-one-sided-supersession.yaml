id: audit-reports-one-sided-supersession
corpus: corpus-b
setup:
  - [init]
invocation: [audit]
expect_exit: 0
# RFC-46 was rejected: a bare-numbered corpus is renamed, not tolerated, so
# the one-sided Supersedes is not reported (no filename gives a record an
# identity). What audit owes instead is the rename guidance, once per type
# (MILE-120), naming the expected file name of every file.
expect_findings:
  - {rule: filename.identity-pattern, file: records}
expect_stdout_contains:
  - "0001-use-a-queue.md -> RECORD-0001-use-a-queue.md"
  - "0002-use-a-stream.md -> RECORD-0002-use-a-stream.md"
