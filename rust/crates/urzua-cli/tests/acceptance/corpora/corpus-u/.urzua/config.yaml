schema_version: 2
rules:
  narrative-field.stale:
    level: warn
    terminal_statuses: [Fixed]
  waiver.matches-nothing: warn
record_types:
  bug:
    dir: docs/bug
    prefix: BUG
    required_fields: [Status]
    known_fields: [Status]
    statuses:
      values: [Open, Fixed]
      success: [Fixed]
  milestone:
    dir: docs/milestone
    prefix: MILE
    required_fields: [Status]
    known_fields: [Status, Blocked-on]
    narrative_fields: [Blocked-on]
    statuses:
      values: [Planned, Done]
      success: [Done]
  waiver:
    dir: docs/waiver
    prefix: WAIVER
    role: suppression
    effective_requires: [Reason]
    required_fields: [Rule, Scope, Reason]
    known_fields: [Rule, Scope, Reason, Expires]
