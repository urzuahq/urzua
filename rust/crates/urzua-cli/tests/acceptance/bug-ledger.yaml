# Fixed bugs no corpus run can show (SPEC-4, "Bug coverage gate"): a release or
# CI workflow, duplication, performance, a comment, test hygiene, documentation
# wording. `check`, `new`, `init`, `fix` and `doctor` over a corpus cannot make
# any of them fail, so a case is not the evidence for them (their bug record's
# `Realized-by` is). One line each, saying why no corpus case can reproduce the bug. An entry is stale, and fails the
# gate, once a case tags its bug.
- bug: BUG-14
  reason: "a knope release-prep step regenerating Cargo.lock; it runs only in the release workflow, and no urzua command reads a corpus to reach it"
- bug: BUG-15
  reason: "ci.yml's changeset gate reading a stale label payload; only a GitHub Actions pull_request event exhibits it"
- bug: BUG-27
  reason: "the release workflow reporting success while preparing nothing; a property of the workflow's steps, which no urzua command runs"
- bug: BUG-28
  reason: "a bot-pushed tag triggering no workflow; a GitHub Actions behaviour of the release pipeline, not of any urzua command"
- bug: BUG-33
  reason: "prepare-release failing on a no-changeset merge; knope's exit status inside the release workflow, outside any corpus run"
- bug: BUG-34
  reason: "the release PR's gate needing a label set with GITHUB_TOKEN; GitHub token semantics in the workflow, not urzua output"
- bug: BUG-35
  reason: "a Conventional Commit prefix cutting a release; knope's release rules in CI, with no urzua command or corpus involved"
- bug: BUG-48
  reason: "changesets naming a missing package passing the release guard; a shell guard script in the release workflow, tested by its own planted-violation cases"
- bug: BUG-92
  reason: "a release-prep bump reaching main on a bugfix branch; branch and merge process in git hosting, not a corpus state"
- bug: BUG-93
  reason: "the computed release version versus the changesets' levels; checked by release scripts in CI, not by urzua over a corpus"
- bug: BUG-96
  reason: "release invariant guards running only under make ci; where a workflow invokes them, which no corpus case can vary"
- bug: BUG-189
  reason: "the changeset job failing without a merge base; a CI checkout depth problem in the workflow, not a urzua behaviour"
- bug: BUG-52
  reason: "a SPEC-2 prose list of rules compared with ALL_RULES; a document-against-code check, which make rule-table-check performs, not a run of check over a corpus"
- bug: BUG-105
  reason: "duplication of the declared-slot list across rules; a refactor with identical output, so no case can fail before and pass after"
- bug: BUG-106
  reason: "duplication of the declared-field union across three places; a refactor with identical output"
- bug: BUG-107
  reason: "comment wording against the comment convention; source text, with no runtime behaviour"
- bug: BUG-113
  reason: "a population invariant that compiles out in release builds; it holds for every input, so no corpus makes it fail"
- bug: BUG-115
  reason: "compute_drifted_records running when embodiment.consistency is off; wasted work with identical findings, observable only as time"
- bug: BUG-116
  reason: "identity.collision rebuilding the shared record index; a performance duplication with identical findings"
- bug: BUG-122
  reason: "census_records cloning and sorting a PathBuf per slot; a performance cost with identical output"
- bug: BUG-133
  reason: "two copies of the record-identifier grammar kept in step by a comment; the duplication is a refactor with identical output, and the drift it once allowed is BUG-114, which lane A reproduces"
- bug: BUG-134
  reason: "rebuilding a type's declared-field set per record; a performance cost with identical output"
- bug: BUG-135
  reason: "a git subprocess per locator per record with no caching; a performance cost with identical findings"
- bug: BUG-138
  reason: "the em-dash no-value sentinel duplicated in two rules; a constant shared in a refactor with identical output"
- bug: BUG-139
  reason: "two copies of filename-id extraction; a duplication refactor with identical output"
- bug: BUG-140
  reason: "a guard chain duplicated across four rules; a refactor with identical output"
- bug: BUG-141
  reason: "a record-type inventory skeleton duplicated across eight config rules; a refactor with identical output"
- bug: BUG-143
