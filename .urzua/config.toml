# Urzua's own governance config -- the tool validating the repository
# building it (SPEC-0001's self-hosting milestone). Phase A slice only
# (SPEC-0002/0003): record types, their directories, required header fields.

schema_version = 1

[record_types.adr]
dir = "docs/adr"
required_fields = ["Status", "Date", "Author", "Deciders"]
header_shape = "yaml-frontmatter"
known_fields = ["Embodiment", "Realized-by", "Stable-Id", "Derives-from", "Supersedes / Superseded-by"]
spec = "SPEC-16"

[record_types.rfc]
dir = "docs/rfc"
required_fields = ["Status", "Date", "Author"]
header_shape = "yaml-frontmatter"
known_fields = ["Stable-Id", "Supersedes / Superseded-by", "Amends"]
spec = "SPEC-17"

# MILE-0074: Author required (same accountability argument as adr/rfc,
# MILE-0078), Embodiment/Derives-from a project-wide optional convention
# (not SPEC-1-specific baggage). Implements/Parent are the two pointer
# fields every spec already carries. MILE-91: Subject required -- a
# one-line, free-text summary of what the spec is about, no backlink
# semantics; BUG-10 corrected most specs' Parent value in the same pass.
[record_types.spec]
dir = "docs/specs"
required_fields = ["Status", "Date", "Version", "Author", "Subject"]
header_shape = "yaml-frontmatter"
known_fields = ["Stable-Id", "Embodiment", "Derives-from", "Implements", "Parent"]
spec = "SPEC-18"

[record_types.milestone]
dir = "docs/milestones"
prefix = "MILE"
required_fields = ["Status", "Phase", "Track"]
header_shape = "yaml-frontmatter"
known_fields = ["Stable-Id", "Implements", "Blocked-on"]
spec = "SPEC-6"

[record_types.bug]
dir = "docs/bugs"
required_fields = ["Status", "Found-in", "Regression-test"]
header_shape = "yaml-frontmatter"
known_fields = ["Realized-by", "Stable-Id"]
spec = "SPEC-9"

[record_types.waiver]
dir = "docs/waiver"
required_fields = ["Rule", "Scope", "Reason"]
header_shape = "yaml-frontmatter"
known_fields = ["Stable-Id", "Expires"]
spec = "SPEC-10"
