# Urzua's own governance config -- the tool validating the repository
# building it (SPEC-0001's self-hosting milestone). Phase A slice only
# (SPEC-0002/0003): record types, their directories, required header fields.

schema_version = 1

[record_types.adr]
dir = "docs/adr"
required_fields = ["Status", "Date", "Author", "Deciders"]
header_shape = "yaml-frontmatter"
known_fields = ["Embodiment", "Realized-by", "Stable-Id", "Derives-from", "Supersedes / Superseded-by"]
spec = "SPEC-16"

[record_types.rfc]
dir = "docs/rfc"
required_fields = ["Status", "Date", "Author"]
header_shape = "yaml-frontmatter"
known_fields = ["Supersedes / Superseded-by", "Amends"]
spec = "SPEC-17"

# spec deliberately has no known_fields yet -- MILE-0074 decides the
# canonical field set (does Author become required? is SPEC-1's
# Embodiment/Derives-from project-wide or SPEC-1-specific?) before this
# rule gets a real target to check spec against (MILE-0081).
[record_types.spec]
dir = "docs/specs"
required_fields = ["Status", "Date", "Version"]
header_shape = "yaml-frontmatter"
spec = "SPEC-18"

[record_types.milestone]
dir = "docs/milestones"
prefix = "MILE"
required_fields = ["Status", "Phase", "Track"]
header_shape = "yaml-frontmatter"
known_fields = ["Stable-Id", "Implements", "Blocked-on"]
spec = "SPEC-6"

[record_types.bug]
dir = "docs/bugs"
required_fields = ["Status", "Found-in", "Regression-test"]
header_shape = "yaml-frontmatter"
known_fields = ["Realized-by", "Stable-Id"]
spec = "SPEC-9"

[record_types.waiver]
dir = "docs/waiver"
required_fields = ["Rule", "Scope", "Reason"]
header_shape = "yaml-frontmatter"
known_fields = ["Stable-Id", "Expires"]
spec = "SPEC-10"
