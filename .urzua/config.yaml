schema_version: 2
# Warnings fail this repository's own CI (MILE-145): the zero-warning state
# must not regress. Both checks.yml steps read this, whole-repo and --base.
fail_on: warning
# The Embodiment vocabulary (MILE-144): the states evidence computes to, highest
# tier first, and the evidence category that lifts a record to each. The engine
# knows no state name; `claims_built` marks the states that say work was built.
# `Deprecated` and `Inactive` are human-set and stay `sticky_states` below.
embodiment:
  drift: Drift detected
  tiers:
    - {state: Verified, evidence: test, claims_built: true}
    - {state: Implemented, evidence: code, claims_built: true}
    - {state: Specified, evidence: spec}
  none: Not started
# Symbol resolvers for scoped evidence pins (ADR-74, MILE-185): how a `Realized-by`
# locator `path#Symbol` finds the item it pins. The engine knows no language; each
# file type a decision cites at symbol level is declared here, with its own
# test vectors in SPEC-3. A line range (`#L10-L40`) needs no resolver.
locator_resolvers:
  - name: rust
    glob: "**/*.rs"
    # A type, function, trait or union, with its visibility and qualifiers (`const fn` included).
    # `const`, `static`, `type` and `mod x;` end at a `;`, not a brace, so a brace_balanced end would
    # run on into the next item: they are not addressable by symbol; pin a line range instead.
    start: '^\s*(pub(\([^)]*\))?\s+)?((const|async|unsafe)\s+)*(fn|struct|enum|trait|union)\s+{symbol}\b'
    end: brace_balanced
    # Doc comments and attributes directly above an item are part of it.
    leading: '^\s*(#\[|///|//!)'
    # `Type::member`: an inherent `impl Type {` or `impl<T> Type<T> {`, in as many blocks as the file has.
    container:
      start: '^\s*impl(<.*?>)?\s+{symbol}(<[^{]*>)?\s*(where\b.*|\{.*)?$'
      end: brace_balanced
      spans: all
    member:
      start: '^\s*(pub(\([^)]*\))?\s+)?((const|async|unsafe)\s+)*fn\s+{symbol}\b'
      end: brace_balanced
    # `Type::<Trait>::member`: `impl Trait for Type {`, with an optional path before the trait.
    trait_container:
      start: '^\s*impl(<.*?>)?\s+([A-Za-z_][A-Za-z0-9_]*::)*{trait}(<[^{]*>)?\s+for\s+{symbol}\b'
      end: brace_balanced
      spans: all
  # `record_types::bug` pins the `bug` entry of this file; `rules::embodiment.consistency` one rule.
  - name: yaml
    glob: "**/*.yaml"
    start: '^\s*{symbol}:'
    end: indent
    container:
      start: '^{symbol}:'
      end: indent
    member:
      start: '^\s+{symbol}:'
      end: indent

record_types:
  adr:
    dir: "docs/adr"
    # The directory index is not an ADR (MILE-150): no rule examines it, and
    # filename.identity-pattern does not count it among the type's files.
    exclude_files: ["README.md"]
    required_fields:
      - "Status"
      - "Date"
      - "Author"
      - "Deciders"
    header_shape: "yaml-frontmatter"
    known_fields:
      - "Embodiment"
      - "Realized-by"
      - "Stable-Id"
      - "Accepted-on"
      - "Derives-from"
      - "Supersedes / Superseded-by"
      - "Non-reference-ids"
    statuses:
      values: ["Proposed", "Accepted", "Rejected", "Superseded", "Retired"]
      success: ["Accepted"]
      failure: ["Rejected", "Superseded", "Retired"]
      implementable: ["Accepted"]
      claim_retained: ["Superseded", "Retired"]
      # The lifecycle (MILE-144, ADR-72): a decision is Proposed, then Accepted or
      # Rejected; an Accepted one is later Superseded or Retired. A decision enters
      # Proposed and is accepted in a later change, never filed already Accepted.
      initial: ["Proposed"]
      transitions:
        Proposed: ["Accepted", "Rejected"]
        Accepted: ["Superseded", "Retired"]
      # The type's placeholder vocabulary (MILE-153): whole values, and patterns. It
      # feeds field.pending and makes status.require count them as missing, so
      # an Accepted ADR whose Deciders reads "Unknown" is not decided.
      # A pattern entry (MILE-162) declares a placeholder family with a variable
      # tail once: `TBD`, `TBD -- awaiting the board`, `to be decided by Q3`.
      pending:
        - "pending"
        - "unknown"
        - "none recorded"
        - {pattern: '(?i)^(tbd|to be (decided|determined))\b'}
      require:
        - {when: ["Accepted"], fields: ["Deciders"]}
    spec: "SPEC-16"
    # How this type's revision log is found (MILE-167): the line itself, not
    # any line that mentions the text. This is the default, declared here so
    # the repository's own records exercise the declaration. `required: true`
    # (also the default) makes `urzua fix --apply` refuse a record with no log
    # to record the write in; `required: false` would apply without a row
    # (MILE-159).
    revision_log: {marker: "**Revision log**", required: true}
    # A type declares Embodiment and Realized-by together (BUG-41); this checks the type, not each record.
    companion_fields:
      - [embodiment_state, embodiment_locator]
    pointer_fields:
      - "Derives-from"
    narrative_fields: []
    # Every decision states its Context (MILE-4). A Rejected ADR made no
    # decision, so it is set aside on purpose (MILE-7, BUG-187): eligible and
    # unexamined, not a configuration that reaches nothing.
    sections:
      from: headings
      required:
        - {name: Context}
      exempt_statuses: ["Rejected"]
  rfc:
    dir: "docs/rfc"
    required_fields:
      - "Status"
      - "Date"
      - "Author"
    header_shape: "yaml-frontmatter"
    known_fields:
      - "Stable-Id"
      - "Accepted-on"
      - "Supersedes / Superseded-by"
      - "Amends"
      - "Amended-by"
      - "Amended-by-pending"
      - "Implements"
      - "Non-reference-ids"
    statuses:
      values: ["Draft", "Discussion", "Accepted", "Rejected", "Superseded"]
      success: ["Accepted"]
      failure: ["Rejected", "Superseded"]
      implementable: ["Accepted"]
      initial: ["Draft"]
      transitions:
        Draft: ["Discussion", "Accepted", "Rejected"]
        Discussion: ["Draft", "Accepted", "Rejected"]
        Accepted: ["Superseded"]
        # A rejected proposal can be reopened as a draft (RFC-30).
        Rejected: ["Draft"]
    spec: "SPEC-17"
    pointer_fields:
      - "Implements"
      - "Amends"
    narrative_fields: []
  spec:
    dir: "docs/specs"
    # The directory index is not a spec (MILE-152).
    exclude_files: ["README.md"]
    # A spec's title opens `SPEC-N`; the other types open with the bare
    # number. The type declares which (BUG-123, RFC-44): `urzua new` writes
    # the declared form and filename.title-consistency checks it.
    identity: {from: filename, pattern: '^(?P<prefix>SPEC)-(?P<number>\d+)-(?P<slug>.+)$'}
    required_fields:
      - "Status"
      - "Date"
      - "Version"
      - "Author"
      - "Subject"
    header_shape: "yaml-frontmatter"
    known_fields:
      - "Stable-Id"
      - "Embodiment"
      - "Realized-by"
      - "Derives-from"
      - "Implements"
      - "Parent"
      - "Last-audited"
    # Shipped (MILE-7): the work the spec describes is built. A spec that says
    # so must carry the evidence for it, which is the require-by-state half of
    # the status-conditioned capability: Embodiment and Realized-by are known
    # fields, optional for Draft and Accepted and required once Shipped. Shipped
    # is a success and implementable state like Accepted: a delivered spec is
    # still cited by the code that implements it.
    statuses:
      values: ["Draft", "Accepted", "Shipped"]
      success: ["Accepted", "Shipped"]
      implementable: ["Accepted", "Shipped"]
      initial: ["Draft"]
      transitions:
        Draft: ["Accepted"]
        Accepted: ["Shipped"]
      require:
        - {when: ["Shipped"], fields: ["Embodiment", "Realized-by"]}
    spec: "SPEC-18"
    # A type declares Embodiment and Realized-by together (BUG-41); this checks the type, not each record.
    companion_fields:
      - [embodiment_state, embodiment_locator]
    # A substantive or structural revision-log row on a changed spec means its
    # Version moves (BUG-51, SPEC-18): `revision-log.version-bump-required`
    # compares against the merge base's copy.
    revision_log:
      marker: "**Revision log**"
      required: true
      version_bump: {field: "Version", classes: ["substantive", "structural"]}
    pointer_fields:
      - "Derives-from"
      - "Implements"
      - "Parent"
    narrative_fields: []
  milestone:
    dir: "docs/milestones"
    prefix: "MILE"
    required_fields:
      - "Status"
      - "Phase"
      - "Track"
    header_shape: "yaml-frontmatter"
    known_fields:
      - "Stable-Id"
      - "Implements"
      - "Blocked-on"
      - "Depends-on"
      - "Blocks"
      - "Realized-by"
    statuses:
      values: ["Planned", "InProgress", "Blocked", "Done", "WontDo"]
      success: ["Done"]
      failure: ["WontDo"]
      # Done is implementable: code that implements a delivered milestone keeps
      # citing it (MILE-133), so a back-pointer to a Done milestone is not a
      # change landing ahead of its decision.
      implementable: ["Planned", "InProgress", "Done"]
      # A milestone starts Planned, or Blocked when filed already waiting, or Done
      # when the PR that files it delivers it. Done can be reopened; WontDo is
      # terminal (SPEC-6).
      initial: ["Planned", "Blocked", "Done"]
      transitions:
        Planned: ["InProgress", "Blocked", "Done", "WontDo"]
        InProgress: ["Planned", "Blocked", "Done", "WontDo"]
        Blocked: ["Planned", "InProgress", "Done", "WontDo"]
        Done: ["Planned", "InProgress"]
      # Status is held to the evidence (MILE-183): the PR that delivers a
      # milestone sets Realized-by and Done together. Implemented or Verified
      # evidence under a not-done status is a disagreement `urzua fix --apply`
      # repairs; Done with nothing behind it is one only evidence repairs. A
      # decision milestone's evidence is the record that records the decision
      # (a spec: locator), which computes to Specified and is neither.
      delivery:
        delivered_tiers: ["Implemented", "Verified"]
        unevidenced_tiers: ["Not started"]
        not_done: ["Planned", "InProgress", "Blocked"]
        set_status: "Done"
    # Every milestone, open or closed, states its Done means (maintainer
    # decision of 2026-11-04): a Done milestone is judged against it and not
    # against its What. A WontDo milestone is set aside on purpose, as a
    # Rejected ADR is: it will never be done, so it has no criteria to meet.
    sections:
      from: headings
      required:
        - {name: "Done means"}
      exempt_statuses: ["WontDo"]
    spec: "SPEC-6"
    pointer_fields:
      - "Implements"
      - "Depends-on"
      - "Blocks"
    narrative_fields:
      - "Blocked-on"
  bug:
    dir: "docs/bugs"
    required_fields:
      - "Status"
      - "Found-in"
      - "Regression-test"
    header_shape: "yaml-frontmatter"
    known_fields:
      - "Realized-by"
      - "Stable-Id"
      - "Implements"
      - "Blocked-on"
    statuses:
      values: ["Open", "Fixed", "WontFix", "Not a bug", "Rejected"]
      success: ["Fixed"]
      failure: ["WontFix", "Not a bug", "Rejected"]
      implementable: ["Open"]
      # A bug fixed in the PR that files it starts Fixed (the fixed-in-PR
      # convention); a fixed or closed bug can be reopened.
      initial: ["Open", "Fixed"]
      transitions:
        Open: ["Fixed", "WontFix", "Not a bug", "Rejected"]
        Fixed: ["Open"]
        WontFix: ["Open"]
        "Not a bug": ["Open"]
        Rejected: ["Open"]
      # Whole values only (BUG-65): a Regression-test that merely mentions
      # the word, or names a test called a_pending_..., is a real value.
      pending:
        - "pending"
        - "not yet written"
        - {pattern: '(?i)^(not yet written|planned:)'}
      # A placeholder Regression-test is legitimate while a bug is Open and a
      # gap once it is Fixed (MILE-169): status.required-field-missing flags the
      # Fixed ones, and field.pending (pending_until_required) stays quiet until then.
      require:
        - {when: ["Fixed"], fields: ["Regression-test"]}
    # Bug records name their first section "What was wrong" or, in older ones,
    # one of the aliases below: they are accepted, and `urzua check` discloses
    # which records use one (MILE-165).
    sections:
      from: headings
      required:
        - {name: "What was wrong", aliases: ["What is wrong", "What was suspected", "What"]}
    spec: "SPEC-9"
    pointer_fields:
      - "Implements"
    narrative_fields:
      - "Blocked-on"
  waiver:
    dir: "docs/waiver"
    # The suppression type (BUG-74): the engine reads this declaration, not the
    # type name, so the records here suppress findings whatever the type is called.
    role: suppression
    # The padded form, chosen so the declared identity is exercised here
    # (MILE-151): `urzua new waiver` fits its file name and H1 to this pattern,
    # and the identity rules read the same grammar back. The one existing
    # waiver was renamed to it.
    identity: {from: filename, pattern: '^(?P<prefix>WAIVER)-(?P<number>\d{4})-(?P<slug>.+)$'}
    required_fields:
      - "Rule"
      - "Scope"
      - "Reason"
    header_shape: "yaml-frontmatter"
    known_fields:
      - "Stable-Id"
      - "Expires"
    spec: "SPEC-10"
    pointer_fields: []
    narrative_fields: []

# An RFC that amends another is echoed by the amended RFC's Amended-by. A claim
# from an RFC that is not yet accepted is provisional (MILE-154, MILE-127): it
# is a warning while the claimant is a Draft or in Discussion, and an error
# once it is accepted without the amended RFC naming it back.
relation_pairs:
  - name: amendment
    forward: "Amends"
    inverse: "Amended-by"
    reciprocity: required
    # Only RFCs carry the pair (MILE-155): an RFC that amends an ADR claims
    # something the ADR cannot echo, since an ADR is amended by a dated section.
    types: ["rfc"]
    provisional:
      statuses: ["Draft", "Discussion"]
      level: warn
      # The amended RFC may acknowledge a pending amendment in its own field
      # (MILE-163) without asserting the amendment before it is accepted.
      acknowledged_by: "Amended-by-pending"
  # The sequencing relation (RFC-48, MILE-27): a record cannot finish until the
  # records it Depends-on do. Only Depends-on is written; Blocks is its inverse,
  # declared so a record that does write it still takes part, and otherwise
  # read from the records (reciprocity: none). `acyclic` makes sequence.cycle
  # report a loop through either field.
  - name: sequencing
    forward: "Depends-on"
    inverse: "Blocks"
    reciprocity: none
    cross_type: true
    acyclic: true

# Every rule this repository has turned on, and at what level. A rule that is
# not named here does not run (ADR-53) and is reported as not-enabled rather
# than omitted (ADR-7).
rules:
  embodiment.requires-accepted-status:
    level: warn
  # A milestone's Status agrees with its delivery evidence (MILE-183): the PR
  # that delivers a milestone sets Realized-by and Done itself, and this fails
  # when they disagree.
  status.delivery-agreement: error
  header.required-fields: error
  header.field-set-consistency: warn
  header.pointer-field-clean: warn
  type.no-declared-spec: warn
  type.dir-matches-nothing: warn
  identity.collision: error
  type.record-outside-declared-dir: warn
  config.pointer-declaration-missing: error
  config.companion-declaration-missing: error
  config.pointer-field-not-known: error
  config.relation-field-not-known: error
  config.known-fields-declaration-missing: error
  config.header-none-has-no-required-fields: error
  config.scope-matches-nothing: warn
  section.required: error
  config.pointer-narrative-overlap: error
  pointer.resolution: error
  # A required field whose value is identical to its type's template text is
  # a placeholder (BUG-22); the template is the vocabulary, not a token list.
  field.quality:
    level: error
    template_placeholders: true
  field.pending:
    level: warn
    pending_until_required: true
  status.undeclared-value: error
  # Each type's lifecycle graph is enforced on a `--base` run, and a declared
  # status the graph cannot reach is reported (MILE-144, ADR-72).
  status.transition-allowed: error
  status.unreachable-state: warn
  status.required-field-missing: error
  date.field-valid:
    level: error
    date_fields: ["Date", "Accepted-on"]
  # An acceptance date may not precede the record's own date (MILE-157).
  date.field-order:
    level: error
    date_order: [{earlier: Date, later: Accepted-on}]
  # A waiver that matches no finding, or has expired, is reported (MILE-168).
  waiver.matches-nothing: warn
  field.untrimmed-value: warn
  field.leading-reserved-indicator: warn
  header.field-case-mismatch: error
  filename.title-consistency: error
  filename.identity-pattern: warn
  relation.supersession-reciprocity: error
  relation.pair-reciprocity: error
  relation.target-status-undeclared: error
  # The sequencing relation (MILE-27): no loop, and no Depends-on value that
  # names nothing.
  sequence.cycle: error
  sequence.unresolved-blocker: error
  revision-log.change-class-required: error
  # Judged on a `--base` run against the merge base's copy of the record
  # (BUG-51); `not-applicable` on a whole-repo run.
  revision-log.version-bump-required: error
  narrative-field.stale:
    level: warn
    terminal_statuses: ["Fixed", "WontFix", "Accepted", "Rejected", "Superseded", "Retired", "Done", "WontDo"]
  # Maintainer decision 2026-11-04: a 14-day grace window, so a code change can
  # land before its record catches up without breaking a zero-warning build (MILE-129).
  embodiment.consistency:
    level: warn
    drift_grace_days: 14
    # A spec's file changes for reasons unrelated to its evidence, so a spec
    # can declare the day its evidence was last audited and the window counts
    # from that instead of from the cited file's last change (MILE-166).
    drift_audit_field: "Last-audited"
    # States a human sets that no evidence can compute (MILE-148): a record
    # stating one is not reported as drift, and `urzua fix` leaves it alone.
    sticky_states: ["Deprecated", "Inactive"]
  embodiment.locator-exists: error
  # Off: an advisory suggestion, and several ADRs citing one rule module is
  # expected now that the rule engine is split into modules (MILE-131).
  embodiment.locator-promotion-candidate: off
  # Superseded only, for now. Draft is available and deliberately not enabled:
  # 28 records point at a Draft target today, and turning it on before deciding
  # whether that is acceptable here would be adopting a policy by accident.
  # Catches a changeset announcing it closed a record the record itself says
  # is still open -- exactly what shipped and had to be corrected on
  # 2026-09-17. Statuses are declared: a built-in list would stop applying the
  # moment a type used one it did not know.
  claim.status-agreement:
    level: error
    claim_paths: [".changeset"]
    closed_statuses: ["Fixed", "Done", "Accepted", "Rejected", "Superseded", "Retired", "Withdrawn"]
  pointer.target-status:
    level: warn
    not_in: ["Superseded"]
    # Every declared pointer/narrative field except Derives-from: lineage to a
    # Superseded record is permanently true history, not a stale dependency
    # (BUG-172).
    fields: ["Implements", "Amends", "Parent", "Blocked-on", "Depends-on"]
  # Code that cites a record (`Implements: ADR-12`) must cite one at a status
  # its type declares `implementable` (MILE-133). Zero findings when enabled.
  embodiment.back-pointer-decision-accepted:
    level: error
    back_pointer_paths: ["rust", "scripts", "ts", "platform"]
  # Source comments are realization evidence (MILE-128): `Implements: ADR-12`
  # is code tier, and `Verifies: ADR-12` in a file under `test_paths` is test
  # tier (MILE-146), so a record is computed Verified from the tests that cite
  # it rather than from a restated `test:` locator.
  embodiment.back-pointer-resolution:
    level: error
    back_pointer_paths: ["rust", "scripts", "ts", "platform"]
    test_paths: ["rust/crates/urzua-cli/tests", "rust/crates/*-core/tests"]
  # The PR gate (`urzua check --base`, checks.yml): a diff that changes the
  # Rust sources must change a governing record in the same diff (MILE-124).
  # Inert on a whole-repo run, where it reports not-applicable.
  # Integration tests sit in each crate's tests/ directory, so a change to
  # them alone is not a change to behaviour needing a record (MILE-158).
  diff.source-requires-record:
    level: error
    source_paths: ["rust/crates"]
    exclude_paths: ["rust/crates/*/tests"]
  # Prose citations of decision ids resolve (MILE-136). RFC-822 and RFC-4122
  # are public standards that share the RFC prefix, not records (MILE-156).
  citation.resolution:
    level: warn
    external_ids: ["RFC-822", "RFC-4122"]
    # A record lists here the ids it names without citing as a reference, so
    # a record later created with that number does not capture the citation
    # (BUG-190, ADR-75).
    non_reference_field: "Non-reference-ids"
    # Revision-log rows are append-only history (RFC-6): an id they cite
    # as it was when the row was written is not read (MILE-156).
    skip_revision_log: true
  # Paths cited under a References heading exist (MILE-143).
  citation.path-exists:
    level: warn
    reference_sections: ["References"]
    # Revision-log rows are append-only history and name a path as it was
    # when the row was written; they are not read (MILE-143).
    skip_revision_log: true
  # Issue and pull request numbers cited under a References heading are in the
  # committed snapshot (MILE-143). `check` reads the file and never the
  # network; `urzua refs refresh` rewrites it from the GitHub API.
  citation.issue-exists:
    level: warn
    reference_sections: ["References"]
    skip_revision_log: true
    issue_refs:
      snapshot: ".urzua/known-refs.json"
      repository: "urzuahq/urzua"
      forms: [number, url]
      # Header fields that carry a PR or issue number (BUG `Found-in`).
      fields: ["Found-in"]
  # The two generated directory indexes (MILE-152): `urzua index --apply`
  # rewrites them from the records. The ADR list names no id (the file name
  # identifies the record); the spec list writes each entry over two lines and
  # shows the declared Status and Date fields beside the id (MILE-164).
  index.freshness:
    level: error
    indexes:
      - path: "docs/adr/README.md"
        type: adr
        format: "- [{title}]({file})"
        begin: "<!-- urzua:index:begin -->"
        end: "<!-- urzua:index:end -->"
      - path: "docs/specs/README.md"
        type: spec
        format: "- [{id}]({file}) \u2014 {Status}, {Date}\n  {title}"
        begin: "<!-- urzua:index:begin -->"
        end: "<!-- urzua:index:end -->"
