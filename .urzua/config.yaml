schema_version: 1
record_types:
  adr:
    dir: "docs/adr"
    required_fields:
      - "Status"
      - "Date"
      - "Author"
      - "Deciders"
    header_shape: "yaml-frontmatter"
    known_fields:
      - "Embodiment"
      - "Realized-by"
      - "Stable-Id"
      - "Derives-from"
      - "Supersedes / Superseded-by"
    spec: "SPEC-16"
    pointer_fields:
      - "Derives-from"
    narrative_fields: []
  rfc:
    dir: "docs/rfc"
    required_fields:
      - "Status"
      - "Date"
      - "Author"
    header_shape: "yaml-frontmatter"
    known_fields:
      - "Stable-Id"
      - "Supersedes / Superseded-by"
      - "Amends"
      - "Implements"
    spec: "SPEC-17"
    pointer_fields:
      - "Implements"
      - "Amends"
    narrative_fields: []
  spec:
    dir: "docs/specs"
    required_fields:
      - "Status"
      - "Date"
      - "Version"
      - "Author"
      - "Subject"
    header_shape: "yaml-frontmatter"
    known_fields:
      - "Stable-Id"
      - "Embodiment"
      - "Derives-from"
      - "Implements"
      - "Parent"
    spec: "SPEC-18"
    pointer_fields:
      - "Derives-from"
      - "Implements"
      - "Parent"
    narrative_fields: []
  milestone:
    dir: "docs/milestones"
    prefix: "MILE"
    required_fields:
      - "Status"
      - "Phase"
      - "Track"
    header_shape: "yaml-frontmatter"
    known_fields:
      - "Stable-Id"
      - "Implements"
      - "Blocked-on"
    spec: "SPEC-6"
    pointer_fields:
      - "Implements"
    narrative_fields:
      - "Blocked-on"
  bug:
    dir: "docs/bugs"
    required_fields:
      - "Status"
      - "Found-in"
      - "Regression-test"
    header_shape: "yaml-frontmatter"
    known_fields:
      - "Realized-by"
      - "Stable-Id"
      - "Implements"
    spec: "SPEC-9"
    pointer_fields:
      - "Implements"
    narrative_fields: []
  waiver:
    dir: "docs/waiver"
    required_fields:
      - "Rule"
      - "Scope"
      - "Reason"
    header_shape: "yaml-frontmatter"
    known_fields:
      - "Stable-Id"
      - "Expires"
    spec: "SPEC-10"
    pointer_fields: []
    narrative_fields: []
